    title: Garbh Sanskar Stories
    blurb: Tales from the Ramayana, Mahabharata and Panchatantra
    icon: auto_stories
    accent: blush
    note: >-
      Garbh Sanskar is a traditional practice. These stories are shared for
      comfort and connection, not as medical guidance.
    channels:
      - UC-aNK_0GZiJiuBdXVZUipAw   # Garbh Sneha (215 videos)
      - UCxbb_h2nCGt74QBDemQlcKw   #  GHARBH VANI (178 videos)
      - UCJFqIQ35dzGhg-8tLHTMsZA   # Bharat - Sanskaron ki Janani (768 videos)
      - UCTkgkWBn4-_LPxi6Kc4cPPA   # Be Listener (291 videos)
      - UCdsQsaeI8pQZtgrMmbjGUug   # Nova Spiritual India (1224 videos)
      - UC8lunbIAM8Y_JEBVol97IxA   # Sanjivan Garbhsanskar  (1286 videos)
      - UCt8dW53ILPDGSScfbJqjkGg   # Gyan Ujala (334 videos)
      - UCKC81SI5JTxRBuBWgf8BEfA   # DreamChild Garbhsanskar  (687 videos)
      - UCqP0U2liCV_xjWhp1nDsW1g   # H2Yoga Aryasudha (329 videos)
      - UCOleOaWSrIjRISUbI8W-FMA   # Krishna Coming Garbh Sanskar (219 videos)
      - UC7jrGv8nhSJJRPZvS1lMLyA   # Anmol Sathi (168 videos)
      - UCrQ2-hzImdJ4A3BD0yIYm-A   # Majestic Garbh Sanskar
      - UCFiqLWzPrnq0RmY36HH43WA   # The Indian Garbh Sanskar
    # A video needs at least one of these in its title to qualify.
    # Leave the list empty to accept everything from the channel.
    include_any:
      - katha
      - kahani
      - story
      - stories
      - कथा
      - कहानी
    exclude_any:
      - shorts
      - trailer
      - promo

