# The only file you edit by hand. Add a channel here and its whole back
# catalogue enters the library on the next run.
#
# To find a channel ID: open the channel, view page source, search for
# "channelId". Or paste the URL into a "youtube channel id finder" tool.

defaults:
  min_views: 700000
  min_views_per_day: 20000
  min_duration_seconds: 90      # drops Shorts and clips
  max_duration_seconds: 14400    # drops 3h+ sleep loops
  max_per_channel: 1000           # stops one prolific channel dominating

categories:
